<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc"><title id="title">Connect Machinista</title><desc id="desc">The Pi makes the sound. Your controller operates it.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ff912e"/></marker></defs><rect width="1200" height="1000" rx="20" fill="#13171d"/><g font-family="Arial, sans-serif"><text x="48" y="65" fill="#ff912e" font-size="18" font-weight="700">MACHINISTA</text><text x="48" y="115" fill="#f6ede3" font-size="38" font-weight="700">Connect Machinista</text><text x="48" y="150" fill="#c9d1da" font-size="23" font-weight="400">The Pi makes the sound. Your controller operates it.</text><rect x="48" y="200" width="400" height="250" rx="16" fill="#252a32" stroke="#46505c"/><rect x="750" y="200" width="402" height="250" rx="16" fill="#252a32" stroke="#46505c"/><g fill="none" stroke="#ff912e" stroke-width="3"><rect x="74" y="225" width="122" height="110" rx="9"/><rect x="86" y="236" width="44" height="15"/><rect x="140" y="236" width="44" height="15"/><rect x="112" y="261" width="12" height="10" rx="1"/><rect x="130" y="261" width="12" height="10" rx="1"/><rect x="148" y="261" width="12" height="10" rx="1"/><rect x="166" y="261" width="12" height="10" rx="1"/><rect x="112" y="277" width="12" height="10" rx="1"/><rect x="130" y="277" width="12" height="10" rx="1"/><rect x="148" y="277" width="12" height="10" rx="1"/><rect x="166" y="277" width="12" height="10" rx="1"/><rect x="112" y="293" width="12" height="10" rx="1"/><rect x="130" y="293" width="12" height="10" rx="1"/><rect x="148" y="293" width="12" height="10" rx="1"/><rect x="166" y="293" width="12" height="10" rx="1"/><rect x="112" y="309" width="12" height="10" rx="1"/><rect x="130" y="309" width="12" height="10" rx="1"/><rect x="148" y="309" width="12" height="10" rx="1"/><rect x="166" y="309" width="12" height="10" rx="1"/></g><text x="220" y="260" fill="#f6ede3" font-size="25" font-weight="700">Controller</text><text x="220" y="291" fill="#f6ede3" font-size="17" font-weight="400">Pads · knobs · displays</text><text x="76" y="385" fill="#f6ede3" font-size="21" font-weight="400">Mikro / MK1 / MK2 / MK3 / +</text><text x="76" y="416" fill="#ff912e" font-size="17" font-weight="700">USB</text><text x="778" y="251" fill="#f6ede3" font-size="28" font-weight="700">Raspberry Pi 4 / 5</text><text x="778" y="293" fill="#ff912e" font-size="22" font-weight="700">Machinista runs here</text><text x="778" y="332" fill="#f6ede3" font-size="18" font-weight="400">SD card: system, projects, samples</text><path d="M460 304 H738" fill="none" stroke="#ff912e" stroke-width="4" marker-end="url(#arrow)"/><text x="487" y="264" fill="#ff912e" font-size="22" font-weight="700">USB cable</text><text x="468" y="344" fill="#f6ede3" font-size="17" font-weight="400">Controls + display data</text><text x="48" y="500" fill="#f6ede3" font-size="25" font-weight="700">Audio: choose one route</text><rect x="48" y="522" width="537" height="153" rx="16" fill="#252a32" stroke="#46505c"/><rect x="607" y="522" width="545" height="153" rx="16" fill="#252a32" stroke="#46505c"/><text x="72" y="560" fill="#ff912e" font-size="24" font-weight="700">MK3 / Maschine+</text><text x="72" y="602" fill="#f6ede3" font-size="21" font-weight="400">Headphones / speakers on the controller</text><text x="72" y="640" fill="#c9d1da" font-size="19" font-weight="400">Audio uses the same USB cable</text><text x="631" y="560" fill="#ff912e" font-size="24" font-weight="700">Mikro / MK1 / MK2</text><text x="631" y="602" fill="#f6ede3" font-size="21" font-weight="400">USB audio interface or audio HAT</text><text x="631" y="640" fill="#c9d1da" font-size="18" font-weight="400">Headphones / speakers on the audio device</text><rect x="48" y="709" width="537" height="132" rx="16" fill="#252a32" stroke="#46505c"/><rect x="607" y="709" width="545" height="132" rx="16" fill="#252a32" stroke="#46505c"/><text x="72" y="747" fill="#f6ede3" font-size="23" font-weight="700">Optional: browser / WebUI</text><text x="72" y="781" fill="#f6ede3" font-size="20" font-weight="400">Phone · tablet · computer</text><text x="72" y="815" fill="#c9d1da" font-size="18" font-weight="400">Transfer samples, edit Sounds</text><text x="631" y="747" fill="#f6ede3" font-size="22" font-weight="700">Power supply for the Pi</text><text x="631" y="781" fill="#f6ede3" font-size="21" font-weight="400">Optional: USB storage</text><text x="631" y="815" fill="#c9d1da" font-size="18" font-weight="400">More samples and project backups</text><text x="48" y="880" fill="#ff912e" font-size="20" font-weight="700">Wi-Fi / Ethernet · No laptop needed while making music</text><text x="48" y="922" fill="#f6ede3" font-size="22" font-weight="700">No controller firmware is replaced.</text><text x="48" y="951" fill="#f6ede3" font-size="19" font-weight="400">To use the original software, reconnect USB to your computer.</text><text x="48" y="978" fill="#c9d1da" font-size="18" font-weight="400">Maschine+ uses Controller mode and also needs an external Pi.</text></g></svg>
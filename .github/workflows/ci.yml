name: Source and workflow checks
'on':
  push:
    branches: [beta, release]
  pull_request:
    branches: [beta, release]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Audit public source
        run: python tools/check_public_source.py
      - name: Portable regression suite (native binary deliberately absent)
        run: python -m unittest discover -v -s tests
  controller-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/controller-survey/*.test.mjs
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libhidapi-dev libasound2-dev liblilv-dev libusb-1.0-0-dev
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - name: Native effects host integration
        run: python3 tools/check_native_effects.py build/audio_engine /tmp/machinista-effect-renders
      - name: Native effects memory safety
        run: |
          g++ -std=c++17 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Isrc tests/native_effects_test.cpp -o /tmp/machinista-effects-memory
          /tmp/machinista-effects-memory
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Native display protocol integration
        run: python -m unittest -v tests.test_mk3_frame_encoder

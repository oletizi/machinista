name: Publish manuals and Controller Lab
on:
  push:
    branches: [beta]
    paths:
      - 'docs/manuals/**'
      - 'web/controller-survey/**'
      - '.github/workflows/manuals-pages.yml'
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: manuals-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Assemble project pages
        run: |
          mkdir -p .pages/controller-survey
          cp -R docs/manuals/. .pages/
          cp -R web/controller-survey/. .pages/controller-survey/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages
      - name: Publish manuals
        id: deployment
        uses: actions/deploy-pages@v4

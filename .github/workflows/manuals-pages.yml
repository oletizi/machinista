name: Publish illustrated manuals
on:
  push:
    branches: [beta]
    paths:
      - 'docs/manuals/**'
      - '.github/workflows/manuals-pages.yml'
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: manuals-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/manuals
      - name: Publish manuals
        id: deployment
        uses: actions/deploy-pages@v4
